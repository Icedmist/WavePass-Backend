services:
  postgres:
    image: postgres:16-alpine
    container_name: wavepass-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-wavepass}
    volumes:
      - wavepass-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: wavepass-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - wavepass-redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    image: registry.digitalocean.com/wavepass/api:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wavepass-api
    restart: unless-stopped
    ports:
      - "4000:3000"
    environment:
      - PORT=3000
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-wavepass}?schema=public
      - REDIS_URL=redis://redis:6379
      - PAYSTACK_SECRET_KEY=${PAYSTACK_SECRET_KEY:-sk_test_mock}
      - PAYSTACK_PUBLIC_KEY=${PAYSTACK_PUBLIC_KEY:-pk_test_mock}
      - MOCK_ROUTER_URL=${MOCK_ROUTER_URL:-http://host.docker.internal:3001}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:8000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  wavepass-pgdata:
  wavepass-redisdata:
