services:
  postgres:
    image: postgres:16-alpine
    container_name: wavepass-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-wavepass}
    volumes:
      - wavepass-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: wavepass-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - wavepass-redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    image: registry.digitalocean.com/wavepass/api:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wavepass-api
    restart: unless-stopped
    ports:
      - "4000:3000"
    env_file:
      - .env
    environment:
      - PORT=3000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  wavepass-pgdata:
  wavepass-redisdata:
