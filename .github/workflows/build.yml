name: Build, Push and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    env:
      DO_REGISTRY_TOKEN: ${{ secrets.DO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Login to DO Registry
        if: env.DO_REGISTRY_TOKEN != ''
        uses: docker/login-action@v3
        with:
          registry: registry.digitalocean.com
          username: ${{ secrets.DO_REGISTRY_USER }}
          password: ${{ secrets.DO_REGISTRY_TOKEN }}
      - name: Build (no push without secrets)
        if: env.DO_REGISTRY_TOKEN == ''
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: registry.digitalocean.com/wavepass/api:latest
      - name: Build and push
        if: env.DO_REGISTRY_TOKEN != ''
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: registry.digitalocean.com/wavepass/api:latest
          cache-from: type=registry,ref=registry.digitalocean.com/wavepass/api:buildcache
          cache-to: type=registry,ref=registry.digitalocean.com/wavepass/api:buildcache,mode=max

  deploy:
    name: Deploy to DigitalOcean Droplet
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: SSH and Deploy to Droplet
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DROPLET_IP }}
          username: ${{ secrets.DROPLET_USER || 'root' }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          passphrase: ${{ secrets.DROPLET_SSH_PASSPHRASE || '' }}
          script: |
            echo "🚀 Starting automated deployment on droplet..."
            cd ~/WavePass-Backend || cd ~/wavepass-backend
            
            echo "📥 Pulling latest git repository changes..."
            git pull --ff-only origin main || echo "⚠️ git pull failed (private repo without credential helper?) — continuing with registry image"

            echo "🐳 Updating API container..."
            # Pull prebuilt image if registry is configured; otherwise build with layer caching
            timeout 300 docker compose pull api || docker compose build api

            echo "🔄 Gracefully updating api container without stopping database..."
            timeout 180 docker compose up -d --no-deps api

            echo "🧹 Pruning old dangling images..."
            timeout 120 docker image prune -f --filter "until=24h" || true

            echo "🩺 Verifying container health..."
            sleep 6
            timeout 30 curl -sf http://localhost:4000/api/v1/health || timeout 30 curl -sf http://localhost:3000/api/v1/health || (echo "⚠️ Health check returned non-200. Showing recent logs:" && timeout 30 docker compose logs --tail=30 api)

            echo "✅ Deployment completed successfully!"
