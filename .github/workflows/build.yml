name: Build, Push and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
  IMAGE_NAME: ghcr.io/icedmist/wavepass-backend

jobs:
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to DigitalOcean Droplet
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: SSH and Deploy to Droplet
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DROPLET_IP }}
          username: ${{ secrets.DROPLET_USER || 'root' }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          passphrase: ${{ secrets.DROPLET_SSH_PASSPHRASE || '' }}
          script: |
            set -euo pipefail
            echo "🚀 Starting automated deployment on droplet..."
            cd ~/WavePass-Backend || cd ~/wavepass-backend

            echo "📥 Pulling latest git repository updates first..."
            git fetch origin main
            git reset --hard origin/main

            echo "🐳 Pulling latest API image (or building locally as fallback)..."
            timeout 300 docker compose pull api || timeout 300 docker compose build api

            echo "🧩 Ensuring Redis and backing services are running..."
            docker compose up -d redis postgres

            echo "🗄️ Running Prisma database migrations before restarting API..."
            timeout 90 docker compose run --rm --no-deps api npx prisma migrate deploy

            echo "🔄 Gracefully restarting API container with migrated schema..."
            timeout 180 docker compose up -d --no-deps api

            echo "🧹 Pruning old dangling images..."
            timeout 120 docker image prune -f --filter "until=24h" || true

            echo "🩺 Verifying container health and database readiness..."
            HEALTH_OK=0
            for i in $(seq 1 15); do
              if curl -sf http://127.0.0.1:4000/api/v1/health >/dev/null && curl -sf http://127.0.0.1:4000/api/v1/health/ready >/dev/null; then
                HEALTH_OK=1
                break
              fi
              sleep 2
            done

            if [ "$HEALTH_OK" -ne 1 ]; then
              echo "❌ Health check failed. Recent API logs:"
              docker compose logs --tail=40 api
              exit 1
            fi

            curl -sf http://127.0.0.1:4000/api/v1/health
            echo ""
            curl -sf http://127.0.0.1:4000/api/v1/health/ready
            echo ""
            echo "✅ Deployment completed successfully!"
